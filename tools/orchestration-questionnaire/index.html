<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orkestrasyon kararları</title>
<style>
/* Dar ekranlarda da okunabilir, sade bir form düzeni kurar. */
*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#211a36;font:16px/1.5 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:32px 20px 64px}h1{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.2}fieldset{border:1px solid #c9c3db;border-radius:12px;background:white;margin:24px 0;padding:20px}legend{font-weight:700;padding:0 6px}label.option{display:flex;gap:10px;margin:14px 0;align-items:baseline}input{accent-color:#51418b}textarea{display:block;width:100%;margin-top:8px;padding:10px;font:inherit;border:1px solid #817995;border-radius:6px;resize:vertical}button{background:#44346e;color:white;border:0;border-radius:8px;padding:12px 24px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{color:#a42634;font-weight:600}.status{min-height:1.5em}*:focus-visible{outline:3px solid #3784b3;outline-offset:3px}
</style></head><body><main><h1>Orkestrasyon kararları</h1><p>Her soru için bir seçenek işaretleyebilir, kendi yanıtınızı yazabilir veya ikisini birlikte kullanabilirsiniz.</p>
<form id="form" novalidate><input type="hidden" id="token" value="__TOKEN__">
<!-- Her soru kendi seçeneklerini ve her zaman açık serbest yanıt alanını taşır. -->
<fieldset><legend>1. Production deploy yetkisi nasıl olsun?</legend><label class="option"><input type="radio" name="q1" value="1"> GitHub push otomatik; production deploy için ayrıca benim onayım alınsın.</label><label class="option"><input type="radio" name="q1" value="2"> Production deploy da doğrulamalardan sonra yönetici kararıyla otomatik yapılsın.</label><label for="t1">Ek açıklama veya kendi yanıtınız</label><textarea id="t1" rows="3"></textarea><p class="error" id="e1"></p></fieldset>
<fieldset><legend>2. Yeni worker açma yetkisi nasıl dağıtılsın?</legend><label class="option"><input type="radio" name="q2" value="1"> Yalnız yönetici worker açsın; worker ihtiyaç duyarsa yöneticiden istesin.</label><label class="option"><input type="radio" name="q2" value="2"> Worker, yöneticiye bağlı kalarak kendi görevi için alt worker açabilsin.</label><label for="t2">Ek açıklama veya kendi yanıtınız</label><textarea id="t2" rows="3"></textarea><p class="error" id="e2"></p></fieldset>
<fieldset><legend>3. Paralel kod işlerinde çalışma alanı nasıl seçilsin?</legend><label class="option"><input type="radio" name="q3" value="1"> Yönetici bağımlılık ve riske göre ayrı worktree veya ortak alan seçsin.</label><label class="option"><input type="radio" name="q3" value="2"> Her bağımsız kod işi ayrı worktree’de yürüsün; birleştirme ayrı görev olsun.</label><label class="option"><input type="radio" name="q3" value="3"> Ortak çalışma alanı kullanılsın; aynı dosyanın tek yazarı olsun.</label><label for="t3">Ek açıklama veya kendi yanıtınız</label><textarea id="t3" rows="3"></textarea><p class="error" id="e3"></p></fieldset>
<button id="send" type="submit">Gönder</button><p id="status" class="status" role="status" aria-live="polite"></p></form></main>
<script>
// Taslağı tarayıcıda saklayarak bağlantı hatasında yanıtları korur.
const form=document.querySelector('#form'), status=document.querySelector('#status'), button=document.querySelector('#send');
let busy=false, submitId=null, pollTimer=null;
const draftKey='orchestration-questionnaire-draft-v1';
// Formdaki mevcut seçenek ve metinleri toplar.
function answers(){return [1,2,3].map(i=>({option:form.querySelector(`input[name=q${i}]:checked`)?.value||null,text:document.querySelector(`#t${i}`).value}));}
// Önceki taslağı aynı tarayıcı sekmesinde geri yükler.
try {const draft=JSON.parse(sessionStorage.getItem(draftKey)||'null'); if(draft) draft.forEach((a,i)=>{document.querySelector(`#t${i+1}`).value=a.text; if(a.option) form.querySelector(`input[name=q${i+1}][value="${a.option}"]`).checked=true;});} catch(e) {}
// Her düzenlemede taslağı günceller ve yeni içerik için yeni kimlik ayırır.
form.addEventListener('input',()=>{sessionStorage.setItem(draftKey,JSON.stringify(answers()));submitId=null;});
// Gerçek sohbet aracı onayı gelene kadar yalnız iletiliyor durumunu gösterir.
async function poll(id){try {const response=await fetch('/status/'+id,{cache:'no-store'});const data=await response.json();if(data.delivered){status.textContent='Yanıtlar sohbete iletildi.';sessionStorage.removeItem(draftKey);return;}}catch(e){} pollTimer=setTimeout(()=>poll(id),1500);}
// Eksik soruları gösterir, geçerli yanıtı yalnız bir kez kaydeder.
form.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const values=answers();let first=null;values.forEach((a,i)=>{const missing=!a.option&&!a.text.trim();document.querySelector(`#e${i+1}`).textContent=missing?'Bir seçenek seçin veya yanıtınızı yazın.':'';if(missing&&!first)first=document.querySelector(`#t${i+1}`);});if(first){first.focus();return;}busy=true;button.disabled=true;form.querySelectorAll('fieldset').forEach(el=>el.disabled=true);status.textContent='Yanıtlar kaydediliyor…';submitId=submitId||crypto.randomUUID();const currentId=submitId;try{const response=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':document.querySelector('#token').value},body:JSON.stringify({version:'2026-11-14-v1',submitId:currentId,answers:values})});if(!response.ok)throw Error();status.textContent='Yanıtlar kaydedildi, sohbete iletiliyor…';poll(currentId);}catch(e){status.textContent='Bağlantı kurulamadı. Yanıtlarınız korundu; yeniden deneyin.';busy=false;button.disabled=false;form.querySelectorAll('fieldset').forEach(el=>el.disabled=false);}});
</script></body></html>
