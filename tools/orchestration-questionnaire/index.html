<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proje karar alanı</title><link rel="icon" href="data:,">
<style>
/* Mevcut formun mor yüzeyleri korunur; belgeler ve kararlar aynı okuma alanını paylaşır. */
*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#211a36;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px 72px}h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.2}h2,h3{line-height:1.35}p,li{overflow-wrap:anywhere}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #c9c3db;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;background:white;color:#44346e}button[aria-selected=true],button.primary{background:#44346e;color:white;border-color:#44346e}button:disabled{opacity:.65;cursor:default}fieldset,.card,article{min-width:0;border:1px solid #c9c3db;border-radius:12px;background:white;margin:20px 0;padding:20px}legend{font-weight:700;padding:0 6px}label.option{display:flex;gap:10px;margin:14px 0;align-items:baseline}input{accent-color:#51418b}textarea{display:block;width:100%;margin-top:8px;padding:10px;font:inherit;border:1px solid #817995;border-radius:6px;resize:vertical}a{color:#44346e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f4fa;padding:14px;border-radius:6px;font:13px/1.6 ui-monospace,monospace}code{font-size:.9em}.error{color:#a42634;font-weight:600}.muted{color:#61596f}.badge{display:inline-block;background:#eaf5fc;color:#264c66;padding:3px 9px;border-radius:5px;font-size:14px}.status{min-height:1.5em}.history-text{white-space:pre-wrap}summary{cursor:pointer;font-weight:650}details{border-top:1px solid #ded9e9;margin-top:16px;padding-top:14px}.diagram-viewport{overflow:auto;max-height:75vh;border:1px solid #ded9e9;border-radius:8px;background:white}.diagram-viewport img{display:block;max-width:none}.diagram-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}article{max-width:900px}article h2,article h3{margin-top:1.7em}article table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}td,th{border:1px solid #d8d2e4;padding:8px;text-align:left}*:focus-visible{outline:3px solid #3784b3;outline-offset:3px}[hidden]{display:none!important}@media(max-width:500px){main{padding:20px 12px 50px}fieldset,.card,article{padding:16px}nav button{flex:1 1 auto;padding:9px 12px}}
</style></head><body><main><header><p class="muted">Data Structures Lab · Çalışma alanı</p><h1>Planlar, sorular ve kararlar</h1><p>Yanıt geçmişi kalıcı olarak saklanır. Gönderilmemiş taslaklar bu tarayıcıda korunur; taslak veya öneri, onaylanmış karar değildir.</p></header>
<input type="hidden" id="token" value="__TOKEN__"><nav id="categories" aria-label="Kategoriler"></nav><h2 id="category-title"></h2><p id="category-description"></p><nav id="sections" aria-label="Bölümler"></nav><p id="global-status" class="status" role="status" aria-live="polite">İçerik yükleniyor…</p><section id="content"></section>
</main><script>
// Bütün kullanıcı metinleri DOM textContent üzerinden yazılır; HTML olarak çalıştırılmaz.
const $=selector=>document.querySelector(selector), content=$('#content'), globalStatus=$('#global-status');
let catalog,history=[],activeCategory='project-planning',activeSection='plan',renderEpoch=0;
const states=new Map(), storagePrefix='questionnaire-v3:';
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
// Güvenlik token'ı restart sonrasında yenilenir; hiçbir taslak silinmez.
async function api(path,options={},retry=true){const response=await fetch(path,{...options,headers:{'X-Session-Token':$('#token').value,...options.headers},cache:'no-store'});if(response.status===403&&retry){const page=await fetch('/',{cache:'no-store'});const html=new DOMParser().parseFromString(await page.text(),'text/html');const token=html.querySelector('#token')?.value;if(token){$('#token').value=token;return api(path,options,false);}}return response;}
// Kategori ve soru revizyonu anahtarı, değişen soruya eski bir cevabın otomatik taşınmasını önler.
function stateFor(category){const signature=category.questions.filter(q=>q.state==='pending').map(q=>q.id+':'+q.revision).join('|');const key=storagePrefix+category.id+':'+catalog.version+':'+signature;if(!states.has(key)){let saved={answers:{},payload:null,delivery:null};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')};}catch(e){}states.set(key,{...saved,key,busy:false});}return states.get(key);}
function save(state){try{localStorage.setItem(state.key,JSON.stringify({answers:state.answers,payload:state.payload,delivery:state.delivery}));}catch(e){globalStatus.textContent='Tarayıcı taslak kaydına izin vermiyor. Sayfayı kapatmadan yanıtınızı gönderin.';}}
// Kalıcı bölüm bağlantıları doğrudan aynı kategori ve belgeyi açar.
function readLocation(){const [id,section]=location.hash.slice(1).split('/');if(catalog?.categories.some(c=>c.id===id)){activeCategory=id;activeSection=id==='orchestration'?'questions':(['plan','architecture','uml','sources','questions'].includes(section)?section:'plan');}}
window.addEventListener('hashchange',()=>{if(catalog){readLocation();render();}});
function category(){return catalog.categories.find(c=>c.id===activeCategory);}
// Bölüm geçişleri form verisini değiştirmez; tıklanan bölüm erişilebilir seçili durumu taşır.
function navigation(){const categories=$('#categories');categories.replaceChildren();for(const item of catalog.categories){const b=node('button',item.label);b.setAttribute('aria-selected',String(item.id===activeCategory));b.onclick=()=>{activeCategory=item.id;activeSection=item.id==='project-planning'?'plan':'questions';render();};categories.append(b);}$('#category-title').textContent=category().label;$('#category-description').textContent=category().description;const sections=$('#sections');sections.replaceChildren();const items=activeCategory==='project-planning'?[['plan','Plan'],['architecture','Mimari'],['uml','UML'],['sources','Kaynaklar'],['questions','Sorular']]:[['questions','Sorular ve kararlar']];for(const [id,label]of items){const b=node('button',label);b.setAttribute('aria-selected',String(id===activeSection));b.onclick=()=>{activeSection=id;render();};sections.append(b);}}
// Markdown'da yalnız güvenli biçimlendirme ve göreli belge bağlantıları etkinleştirilir.
function inline(text,target){const pattern=/\[([^\]]+)\]\(([^)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*/g;let start=0;for(const m of text.matchAll(pattern)){target.append(document.createTextNode(text.slice(start,m.index)));if(m[3])target.append(node('code',m[3]));else if(m[4])target.append(node('strong',m[4]));else{const destinations={'PROJECT_PLAN.md':'plan','ARCHITECTURE.md':'architecture','UML.md':'uml','SOURCE_MAP.md':'sources'};const destination=destinations[m[2].split('/').pop().split('#')[0]];const link=node(destination?'a':'span',m[1]);if(destination)link.href='#project-planning/'+destination;target.append(link);}start=m.index+m[0].length;}target.append(document.createTextNode(text.slice(start)));}
function markdown(text){const article=node('article');const lines=text.split('\n');let code=null,table=null,list=null;for(const line of lines){if(line.startsWith('```')){if(code){article.append(code);code=null;}else code=node('pre');continue;}if(code){code.textContent+=line+'\n';continue;}if(!line.trim()){table=null;list=null;continue;}if(/^\|.*\|$/.test(line.trim())){if(/^\|[\s:|\-]+\|$/.test(line.trim()))continue;if(!table){table=node('table');article.append(table);}const row=node('tr');for(const cell of line.trim().slice(1,-1).split('|')){const td=node('td');inline(cell.trim(),td);row.append(td);}table.append(row);continue;}table=null;const heading=line.match(/^(#{1,6})\s+(.*)/);if(heading){const el=node('h'+Math.min(heading[1].length+1,6));inline(heading[2],el);article.append(el);list=null;continue;}const bullet=line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);if(bullet){if(!list){list=node('ul');article.append(list);}const li=node('li');inline(bullet[1],li);list.append(li);continue;}list=null;const p=node('p');inline(line,p);article.append(p);}if(code)article.append(code);return article;}
const deliveryLabels={queued:'Sohbet kuyruğuna kabul edildi; yönetici okuması henüz doğrulanmadı.',read:'Yönetici tarafından okundu.',unknown:'Kaydedildi; kuyruk kabulü belirsiz. Tekrar gönderim durduruldu.',retryable:'Kaydedildi; sohbet iletimi yeniden denenebilir.'};
// Eski cevaplar özgün sürüm ve etiketleriyle gösterilir; yeni bir onay gönderilmez.
function appendHistory(parent){const section=node('section');section.append(node('h3','Yanıt geçmişi'));const records=history.filter(item=>item.categoryId===activeCategory);if(!records.length)section.append(node('p','Bu kategoride henüz gönderilmiş yanıt yok.','muted'));for(const item of records){const details=node('details');details.open=true;details.append(node('summary',new Date(item.savedAt*1000).toLocaleString('tr-TR')+' · '+item.version));details.append(node('p',deliveryLabels[item.delivery]||item.delivery,'muted'));for(const answer of item.answers){details.append(node('h4',answer.snapshot.label));if(answer.snapshot.description)details.append(node('p',answer.snapshot.description));const selected=answer.snapshot.options.find(option=>option.id===answer.option);if(answer.option)details.append(node('p','Seçenek '+answer.option+': '+(selected?.label||'Özgün seçenek etiketi bilinmiyor')));if(answer.text)details.append(node('p',answer.text,'history-text'));}if(Object.keys(item.documentVersions||{}).length){const versions=node('details');versions.append(node('summary','Yanıtın bağlı olduğu belge sürümleri'));for(const doc of Object.values(item.documentVersions))versions.append(node('p',doc.path+' · SHA-256 '+doc.sha256));details.append(versions);}details.append(node('small','Gönderi: '+item.submitId));section.append(details);}parent.append(section);}
function renderQuestions(){const group=category(),state=stateFor(group),pending=group.questions.filter(q=>q.state==='pending');const container=node('div');for(const q of group.questions.filter(q=>q.state==='decided')){const card=node('section',undefined,'card');card.append(node('span','Karara bağlandı','badge'),node('h3',q.label),node('p',q.answer));const details=node('details');details.append(node('summary','Özgün seçenekler ve karar kaydı'));for(const option of q.options)details.append(node('p',option.id+'. '+option.label));const source=node('button','Kanonik karar kaydını oku');source.onclick=async()=>{const r=await api('/document/'+q.id);if(r.ok){const doc=markdown(await r.text());source.replaceWith(doc);}};details.append(source);card.append(details);container.append(card);}if(!pending.length)container.append(node('p','Yanıt bekleyen soru yok. Önceki sorular ve yanıtlar aşağıda korunur.','card'));
if(pending.length){const form=node('form');form.noValidate=true;const inputs=[];for(const q of pending){const field=node('fieldset');field.append(node('legend',q.label));if(q.description)field.append(node('p',q.description));const answer=state.answers[q.id]||{option:null,text:''};for(const option of q.options){const label=node('label',undefined,'option'),radio=node('input');radio.type='radio';radio.name=q.id;radio.value=option.id;radio.checked=answer.option===option.id;label.append(radio,document.createTextNode(option.label));field.append(label);}const id='text-'+q.id,label=node('label','Ek açıklama veya kendi yanıtınız');label.htmlFor=id;const text=node('textarea');text.id=id;text.rows=3;text.value=answer.text;const error=node('p','','error');field.append(label,text,error);form.append(field);inputs.push({q,field,text,error});}const send=node('button','Gönder','primary');send.type='submit';const status=node('p',state.delivery?deliveryLabels[state.delivery]:'','status');status.setAttribute('role','status');status.setAttribute('aria-live','polite');form.append(send,status);const locked=()=>state.busy||['queued','read','unknown'].includes(state.delivery);function sync(){for(const input of inputs)input.field.disabled=locked();send.disabled=locked();}sync();form.oninput=()=>{for(const {q,text}of inputs)state.answers[q.id]={option:form.querySelector('input[name="'+q.id+'"]:checked')?.value||null,text:text.value};state.payload=null;state.delivery=null;save(state);};form.onsubmit=async event=>{event.preventDefault();if(locked())return;let missing=false;for(const {q,text,error}of inputs){const answer=state.answers[q.id]||{option:null,text:text.value};const invalid=!answer.option&&!answer.text.trim();error.textContent=invalid?'Bir seçenek seçin veya yanıtınızı yazın.':'';if(invalid&&!missing)text.focus();missing||=invalid;}if(missing)return;state.busy=true;sync();status.textContent='Yanıtlar kaydediliyor ve sohbet kuyruğuna gönderiliyor…';if(!state.payload){state.payload={version:catalog.version,submitId:crypto.randomUUID(),categoryId:group.id,documentVersions:catalog.documentVersions,answers:pending.map(q=>({questionId:q.id,revision:q.revision,...state.answers[q.id],snapshot:{label:q.label,description:q.description||'',options:q.options}}))};save(state);}try{const response=await api('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.payload)});const data=await response.json();if(data.error==='documents_changed'){status.textContent='Plan veya mimari belgeleri güncellendi. Yanıt taslağınız korundu; sayfayı yenileyip güncel belgeleri okuyun ve Gönder’e yeniden basın.';state.payload=null;save(state);}else if(data.error==='schema_changed'){status.textContent='Sorular güncellendi. Eski taslağınız korundu; sayfayı yenileyin. Yeni sorulara eski yanıt otomatik uygulanmaz.';}else if(data.saved){state.delivery=data.delivery;save(state);status.textContent=deliveryLabels[data.delivery];if(['queued','read','unknown'].includes(data.delivery)){await loadHistory();if(activeCategory===group.id&&activeSection==='questions')render();}}else status.textContent='Gönderim kabul edilmedi. Yanıtlarınız korundu.';}catch(e){status.textContent='Bağlantı kurulamadı. Yanıtlarınız korundu; aynı gönderiyle yeniden deneyin.';}finally{state.busy=false;sync();}};container.append(form);}
// Önceki sürüm taslakları silinmez; geçmiş soruya yeni soru gibi uygulanmaz.
const oldDrafts=node('details');oldDrafts.append(node('summary','Korunan önceki taslaklar'));let found=false;try{for(let i=0;i<sessionStorage.length;i++){const key=sessionStorage.key(i);if(key.startsWith('orchestration-questionnaire-draft-')){const raw=sessionStorage.getItem(key);oldDrafts.append(node('h4',key),node('pre',raw));found=true;}}for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith(storagePrefix)&&key!==state.key){const saved=JSON.parse(localStorage.getItem(key));if(Object.keys(saved.answers||{}).length){oldDrafts.append(node('h4',key),node('pre',JSON.stringify(saved.answers,null,2)));found=true;}}}}catch(e){}if(found)container.append(oldDrafts);appendHistory(container);content.append(container);}
async function loadHistory(){const response=await api('/history');if(response.ok)history=await response.json();}
function historyReplace(){window.history.replaceState(null,'','#'+activeCategory+'/'+activeSection);}
// Belge okuma yarışında eski istek başka bölümü ezemez.
async function render(){historyReplace();const epoch=++renderEpoch;navigation();content.replaceChildren();globalStatus.textContent='';if(activeSection==='questions'){renderQuestions();return;}globalStatus.textContent='Belge yükleniyor…';try{const response=await api('/document/'+activeSection);if(!response.ok)throw Error();const text=await response.text();if(epoch!==renderEpoch)return;content.append(node('p','Taslak / öneri · Uygulanmış durum ve önerilen değişiklikler belgede ayrı belirtilir.','badge'));if(activeSection==='uml'){await renderDiagrams(text,epoch);}else content.append(markdown(text));globalStatus.textContent='';}catch(e){if(epoch===renderEpoch)globalStatus.textContent='Bu belge henüz hazır değil veya bağlantı kurulamadı. Diğer bölümlere geçebilirsiniz.';}}
// Yerel SVG'ler kaynak hash'i ile eşleştiğinde gösterilir; stale diyagram doğruymuş gibi sunulmaz.
async function renderDiagrams(text,epoch){const response=await api('/diagrams');const diagrams=await response.json();if(epoch!==renderEpoch)return;const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(b=>b.toString(16).padStart(2,'0')).join('');if(epoch!==renderEpoch)return;const matches=diagrams.filter(d=>d.sourceHash===hash);if(!matches.length){content.append(node('p','Diyagram görselleri bu belge revizyonu için henüz hazırlanmadı.'));return;}for(const d of matches){const card=node('section',undefined,'card');card.append(node('h3',d.title));const tools=node('div',undefined,'diagram-tools'),viewport=node('div',undefined,'diagram-viewport'),img=node('img');img.alt=d.title;let zoom=1;const blob=await(await api('/diagram/'+d.file)).blob();if(epoch!==renderEpoch)return;const svgText=await blob.text();const viewBox=new DOMParser().parseFromString(svgText,'image/svg+xml').documentElement.getAttribute('viewBox')?.split(/\s+/).map(Number);const naturalWidth=viewBox?.[2]||1200;const url=URL.createObjectURL(blob);img.src=url;img.onload=()=>{URL.revokeObjectURL(url);img.style.width='100%';};const change=value=>{zoom=value;img.style.width=(zoom*100)+'%';};for(const [label,fn]of [['−',()=>change(Math.max(1,zoom-.5))],['+',()=>change(zoom*1.5)],['Gerçek boyut',()=>change(Math.max(1,naturalWidth/viewport.clientWidth))],['Sığdır',()=>change(1)]]){const b=node('button',label);b.setAttribute('aria-label',label==='+'?'Diyagramı büyüt':label==='−'?'Diyagramı küçült':label);b.onclick=fn;tools.append(b);}tools.append(node('small','Büyütünce diyagram alanında kaydırabilirsiniz.'));viewport.append(img);card.append(tools,viewport);content.append(card);}const source=node('details');source.append(node('summary','UML belgesini ve Mermaid kaynağını oku'),markdown(text));content.append(source);}
// Açılış sırasında geçmiş yüklenmeden onay durumu hakkında varsayım yapılmaz.
(async()=>{try{const response=await api('/catalog');if(!response.ok)throw Error();catalog=await response.json();await loadHistory();readLocation();render();}catch(e){globalStatus.textContent='İçerik yüklenemedi. Sayfayı yenileyerek tekrar deneyin; taslaklarınız korunur.';}})();
</script></body></html>
